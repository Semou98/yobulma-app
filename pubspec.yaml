name: yoboulma_app
description: "Plateforme de livraison groupée du dernier kilomètre pour Dakar"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3

  # Firebase (versions mises à jour)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  firebase_storage: ^12.4.10

  # Maps & Location - Solution OpenStreetMap
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  geolocator: ^13.0.4  # Version mise à jour
  geocoding: ^3.0.0
  url_launcher: ^6.3.2

  # State Management & Navigation
  provider: ^6.1.5+1
  go_router: ^14.8.1

  # HTTP & API
  http: ^1.6.0
  dio: ^5.9.0

  # Utils & Storage
  intl: ^0.19.0
  uuid: ^4.5.2
  shared_preferences: ^2.5.4
  permission_handler: ^11.4.0
  image_picker: ^1.2.1

  # OTP & Security
  otp: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_yoboulma.png